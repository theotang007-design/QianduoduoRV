{% extends "base.html" %}
{% block title %}暂无报告 · {{ app_name }}{% endblock %}
{% block content %}
<div class="card">
  <div class="empty">
    <span class="ai-avatar big">✨</span>
    <h1>我还没有{% if date %} {{ date }} 的{% endif %}复盘可以给你看</h1>
    <p class="muted" style="margin-top:10px;">
      先去「持仓管理」把你的股票加进来，然后点右上角「✨ 让 AI 复盘」，<br>
      我就会去读行情和消息，几分钟后给你一份完整结论。
    </p>
    <p style="margin-top:26px;">
      <a class="btn btn-run" href="/holdings"
         style="text-decoration:none;padding:10px 24px;display:inline-block;">先去添加持仓 →</a>
    </p>
    <p class="muted" style="margin-top:18px;font-size:12px;">
      也可以在命令行运行 <code>python run_review.py --force</code>
    </p>
  </div>
</div>

<style>
  .empty .ai-avatar.big {
    display: inline-flex; width: 52px; height: 52px;
    border-radius: 12px; font-size: 24px; margin-bottom: 18px;
  }
</style>
{% endblock %}
